name: Cypress CI Workflow
on: pull_request
jobs:
  ci-cypress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cypress run
        uses: cypress-io/github-action@v3
        with:
          project: ./cypress
          config-file: ../cypress.config.mjs
          browser: chrome
          build: yarn build
          start: yarn start
          wait-on: "http://localhost:5173"
